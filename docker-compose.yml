version: '3.8'

services:
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - BOT_TYPE=discord
    restart: unless-stopped
    profiles:
      - discord
      - all

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - BOT_TYPE=telegram
    restart: unless-stopped
    profiles:
      - telegram
      - all

# Usage:
# docker-compose up --profile discord      # Discord bot only
# docker-compose up --profile telegram     # Telegram bot only
# docker-compose up --profile all          # Both bots
